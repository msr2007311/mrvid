<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17131f"><title>mrvid</title>
<style>

</style></head><body>
<div id="lock"><h1>mr<b>vid</b></h1><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><div id="pe" style="color:#e5484d"></div><button class="ac" id="unl">Unlock</button></div>
<div id="pn">…</div>

<div class="row"><input id="q" placeholder="Search…" style="background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:9px;flex:1;min-width:120px"><select id="so" style="background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:9px"></select></div>

<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
let M;try{M=JSON.parse(localStorage.getItem('mv'))}catch(e){}M=Object.assign({v:{},f:[],s:{}},M||{});
M.s=Object.assign({ac:'#8f6ff0',th:'dark',sort:'new',rev:0,view:'grid',cols:2,r:14,name:'Master',harpy:1,pin:'',img:''},M.s);
if(M.s.ac==='#ff5a1f')M.s.ac='#8f6ff0';
const save=()=>{try{localStorage.setItem('mv',JSON.stringify(M))}catch(e){}};
const D=()=>new Date().toISOString().slice(0,10),VX=/\.(mp4|mkv|mov|avi|webm|m4v|3gp|ts|flv|wmv|mpg|mpeg)$/i;
const fmt=b=>b>1e9?(b/1e9).toFixed(2)+' GB':(b/1e6).toFixed(1)+' MB',p2=n=>String(n).padStart(2,'0');
const tm=s=>{s=s|0;const h=s/3600|0,m=s%3600/60|0;return(h?h+':'+p2(m):m)+':'+p2(s%60)};
const toast=t=>{$('#bt').textContent=t;$('#bar').style.display='block';$('#bar i').style.width=0;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#bar').style.display='none',3500)};
const prog=(t,f)=>{if(!t){$('#bar').style.display='none';return}$('#bt').textContent=t;$('#bar').style.display='block';$('#bar i').style.width=(f*100)+'%'};
function apply(){const r=document.documentElement,s=M.s;r.style.setProperty('--ac',s.ac);r.dataset.theme=s.th;r.dataset.v=s.view;r.style.setProperty('--cols',s.view==='list'?1:s.cols);r.style.setProperty('--r',s.r+'px')}
const SORTS={new:'Newest',old:'Oldest',name:'Name',size:'Size',dur:'Duration',plays:'Most played',fav:'Favourites first'};
let root,tdir,L=[],tc={},cf='all',q='',shufMode=0,cur,curList=[];
async function init(){try{const o=await navigator.storage.getDirectory();root=await o.getDirectoryHandle('mrvid',{create:true});tdir=await root.getDirectoryHandle('.thumbs',{create:true});navigator.storage.persist&&navigator.storage.persist()}catch(e){toast('Private storage isn’t available in this browser');return}await refresh()}
const nv=()=>({added:Date.now(),plays:0,fav:0,folder:'',pos:0,dur:0,watch:0,days:{}});
async function refresh(){L=[];for await(const[n,h]of root.entries())if(h.kind==='file'){const f=await h.getFile();L.push({n,h,size:f.size,m:M.v[n]||(M.v[n]=nv())})}save();render();for(const v of L)if(!v.m.th){await gen(v);render()}}
function seek(el,t){return new Promise(r=>{const k=setTimeout(r,5000);el.addEventListener('seeked',()=>{clearTimeout(k);r()},{once:true});el.currentTime=t})}
async function gen(v){const f=await v.h.getFile(),u=URL.createObjectURL(f),el=E('video');el.muted=true;el.playsInline=true;el.preload='auto';el.src=u;
 try{await new Promise((ok,no)=>{el.onloadedmetadata=ok;el.onerror=no;setTimeout(no,9000)});v.m.dur=el.duration||0;const c=E('canvas');c.width=320;c.height=180;const x=c.getContext('2d');let best=-1,img;
  for(const p of[.1,.3,.5,.7]){await seek(el,el.duration*p);const vw=el.videoWidth,vh=el.videoHeight,s=Math.max(320/vw,180/vh);x.drawImage(el,(320-vw*s)/2,(180-vh*s)/2,vw*s,vh*s);
   const d=x.getImageData(0,0,320,180).data;let sum=0,n=0;for(let i=0;i<d.length;i+=64){sum+=d[i]+d[i+1]+d[i+2];n+=3}const b=sum/n;if(b>best){best=b;img=c.toDataURL('image/jpeg',.8)}if(b>30)break}
  const bl=await(await fetch(img)).blob(),w=await(await tdir.getFileHandle(v.n+'.jpg',{create:true})).createWritable();await w.write(bl);await w.close();delete tc[v.n]}catch(e){}
 URL.revokeObjectURL(u);v.m.th=1;save()}
async function turl(n){if(tc[n])return tc[n];try{return tc[n]=URL.createObjectURL(await(await tdir.getFileHandle(n+'.jpg')).getFile())}catch(e){return''}}
function sorted(a){const k=M.s.sort,c={new:(x,y)=>y.m.added-x.m.added,old:(x,y)=>x.m.added-y.m.added,name:(x,y)=>x.n.localeCompare(y.n),size:(x,y)=>y.size-x.size,dur:(x,y)=>y.m.dur-x.m.dur,plays:(x,y)=>y.m.plays-x.m.plays,fav:(x,y)=>y.m.fav-x.m.fav||y.m.added-x.m.added}[k];a=[...a].sort(c);return M.s.rev?a.reverse():a}
const shown=()=>sorted(L.filter(v=>(cf==='all'||(cf==='fav'?v.m.fav:v.m.folder===cf))&&v.n.toLowerCase().includes(q)));
function card(v,list){const c=E('div','card'),m=v.m;c.innerHTML=`<div class="th"><img alt=""><b class="du">${m.dur?tm(m.dur):''}</b><i class="pg" style="width:${m.dur?Math.min(100,m.pos/m.dur*100):0}%"></i></div><div class="ct"><div class="nm"></div><div class="sb">${fmt(v.size)}${m.plays?' · '+m.plays+'×':''}${m.folder?' · 📁'+m.folder:''}</div></div><button class="mo">⋮</button><span class="hv">${m.fav?'♥':''}</span>`;
 c.querySelector('.nm').textContent=v.n.replace(/\.[^.]+$/,'');const im=c.querySelector('img');turl(v.n).then(u=>u?im.src=u:im.replaceWith(E('div','', '<div style="font-size:30px;text-align:center;padding-top:14%">🎞</div>')));
 c.querySelector('.th').onclick=()=>play(v,list);c.querySelector('.mo').onclick=()=>acts(v);return c}
function render(){const g=$('#grid'),a=shown();g.innerHTML='';if(!a.length)g.append(E('div','empty','No videos here yet.<br>Tap ＋ to add a folder or videos.'));a.forEach(v=>g.append(card(v,a)));
 $('#ch').innerHTML='';[['all','All'],['fav','♥ Favourites'],...M.f.map(f=>[f,'📁 '+f])].forEach(([k,l])=>{const b=E('button','chip'+(cf===k?' on':''));b.textContent=l;b.onclick=()=>{cf=k;render()};if(k!=='all'&&k!=='fav')b.oncontextmenu=e=>{e.preventDefault();fold(k)};b.onpointerdown=()=>{b.t=setTimeout(()=>k!=='all'&&k!=='fav'&&fold(k),700)};b.onpointerup=b.onpointerleave=()=>clearTimeout(b.t);$('#ch').append(b)});
 const n=E('button','chip','＋ Folder');n.onclick=newFold;$('#ch').append(n)}
function sheet(t,items){const s=$('#sh');s.innerHTML='';s.append(E('h3','',t));items.forEach(([l,f])=>{const b=E('button','sb2');b.textContent=l;b.onclick=()=>{$('#shw').classList.remove('on');f&&f()};s.append(b)});$('#shw').classList.add('on')}
$('#shw').onclick=e=>{if(e.target.id==='shw')$('#shw').classList.remove('on')};
function newFold(){const n=(prompt('Folder name:')||'').trim();if(n&&!M.f.includes(n)){M.f.push(n);save();render()}}
function fold(k){sheet('📁 '+k,[['Rename',()=>{const n=(prompt('New name:',k)||'').trim();if(n){M.f=M.f.map(x=>x===k?n:x);L.forEach(v=>{if(v.m.folder===k)v.m.folder=n});cf='all';save();render()}}],['Delete folder (videos stay)',()=>{M.f=M.f.filter(x=>x!==k);L.forEach(v=>{if(v.m.folder===k)v.m.folder=''});cf='all';save();render()}]])}
function acts(v){sheet(v.n,[['▶ Play',()=>play(v,shown())],[v.m.fav?'♡ Remove favourite':'♥ Favourite',()=>{v.m.fav^=1;save();render()}],['📁 Move to folder',()=>sheet('Move to…',[['— No folder —',()=>{v.m.folder='';save();render()}],...M.f.map(f=>[f,()=>{v.m.folder=f;save();render()}]),['＋ New folder',()=>{newFold();}]])],['🗑 Delete from mrvid',async()=>{if(confirm('Delete from mrvid?')){await root.removeEntry(v.n);try{await tdir.removeEntry(v.n+'.jpg')}catch(e){}delete M.v[v.n];save();refresh()}}]])}
async function walk(d,o){for await(const[n,h]of d.entries()){if(h.kind==='file'){if(VX.test(n))o.push(await h.getFile())}else await walk(h,o)}return o}
async function imp(files){let i=0;for(const f of files){i++;const ex=L.find(v=>v.n===f.name);if(ex&&ex.size===f.size)continue;const n=ex?Date.now()+'_'+f.name:f.name;
 try{const w=await(await root.getFileHandle(n,{create:true})).createWritable();let c=0;await f.stream().pipeThrough(new TransformStream({transform(ch,k){c+=ch.byteLength;k.enqueue(ch);prog(`Saving ${i}/${files.length}: ${f.name} ${c/f.size*100|0}%`,c/f.size)}})).pipeTo(w);M.v[n]=Object.assign(nv(),{folder:M.f.includes(cf)?cf:''})}catch(e){toast('Failed: '+f.name+' ('+e.message+')');try{await root.removeEntry(n)}catch(_){}}}
 prog('');await refresh();toast('Done ✔ — safe even if you delete the originals')}
const vids=fl=>[...fl].filter(f=>f.type.startsWith('video/')||VX.test(f.name));
$('#f1').onchange=e=>{imp(vids(e.target.files));e.target.value=''};$('#f2').onchange=e=>{const a=vids(e.target.files);a.length?imp(a):toast('No videos found');e.target.value=''};
$('#add').onclick=()=>sheet('Add to mrvid',[['📂 Add folder',async()=>{if(window.showDirectoryPicker){try{const a=await walk(await showDirectoryPicker(),[]);a.length?imp(a):toast('No videos found in that folder')}catch(e){}}else $('#f2').click()}],['🎞 Add videos (pick files)',()=>$('#f1').click()]]);
$('#q').oninput=e=>{q=e.target.value.toLowerCase();render()};
$('#so').innerHTML=Object.entries(SORTS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('');$('#so').value=M.s.sort;$('#so').onchange=e=>{M.s.sort=e.target.value;save();render()};
const seedPick=(a,salt)=>{if(!a.length)return null;let h=0;for(const c of D()+salt)h=(h*31+c.charCodeAt(0))>>>0;return a[h%a.length]};
const rnd=a=>a[Math.random()*a.length|0];
function playAll(a,sh){if(!a.length)return toast('Nothing to play yet');shufMode=sh;const l=sh?[...a].sort(()=>Math.random()-.5):a;play(l[0],l)}
function showList(t,a){const o=$('#ov');o.innerHTML='';const h=E('header','','<button id="ox">‹</button><h1></h1>');h.querySelector('h1').textContent=t;o.append(h);const g=E('div');g.id='';g.style.cssText='display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:12px;padding:0 14px 40px';if(!a.length)g.append(E('div','empty','Nothing yet — watch some videos!'));a.forEach(v=>g.append(card(v,a)));o.append(g);o.classList.add('on');$('#ox').onclick=()=>o.classList.remove('on')}
const todayW=v=>v.m.days[D()]||0;
$('#dice').onclick=()=>{if(!L.length)return toast('Add videos first');const v=rnd(L);toast('🎲 '+v.n);play(v,shown())};$('#shuf').onclick=()=>playAll(shown(),1);
$('#mn').onclick=()=>sheet('☰ mrvid',[
 ['🌅 Video of the day',()=>{const v=seedPick(L,'d');v?showList('🌅 Video of the day',[v]):toast('Add videos first')}],
 ['💎 Gem video (hidden treasure)',()=>{const m=Math.min(...L.map(v=>v.m.plays)),a=L.filter(v=>v.m.plays===m);const v=seedPick(a,'g');v?showList('💎 Gem video',[v]):toast('Add videos first')}],
 ['🔥 Top 3 of the day',()=>showList('🔥 Top 3 today',[...L].filter(todayW).sort((a,b)=>todayW(b)-todayW(a)).slice(0,3))],
 ['🏆 Top 5 of all time',()=>showList('🏆 Top 5',[...L].filter(v=>v.m.watch).sort((a,b)=>b.m.watch-a.m.watch).slice(0,5))],
 ['🎭 Mood shuffle',()=>sheet('Mood?',[['⚡ Short (under 10 min)',()=>playAll(L.filter(v=>v.m.dur&&v.m.dur<600),1)],['🎬 Long (over 30 min)',()=>playAll(L.filter(v=>v.m.dur>1800),1)],['🆕 Unwatched',()=>playAll(L.filter(v=>!v.m.plays),1)],['♥ Favourites',()=>playAll(L.filter(v=>v.m.fav),1)]])],
 ['📁 New folder',newFold],['💾 Backup',backup],['♻ Restore settings/folders',()=>$('#f3').click()],['📊 Stats',stats],['🎨 Customisation',cust],['🔒 PIN lock',setPin]]);
function stats(){const t=L.reduce((s,v)=>s+v.m.watch,0),td=L.reduce((s,v)=>s+todayW(v),0),days=new Set(L.flatMap(v=>Object.keys(v.m.days))).size;sheet('📊 Stats',[[`Videos: ${L.length} · ${fmt(L.reduce((s,v)=>s+v.size,0))}`],[`Watched today: ${tm(td)}`],[`Watched total: ${tm(t)} over ${days} day(s)`],[`Favourites: ${L.filter(v=>v.m.fav).length} · Folders: ${M.f.length}`]])}
async function backup(){const j=JSON.stringify(M);if(window.showDirectoryPicker){try{const d=await showDirectoryPicker({mode:'readwrite'});let i=0;for(const v of L){prog(`Backing up ${++i}/${L.length}`,i/L.length);await(await v.h.getFile()).stream().pipeTo(await(await d.getFileHandle(v.n,{create:true})).createWritable())}const w=await(await d.getFileHandle('mrvid-backup.json',{create:true})).createWritable();await w.write(j);await w.close();prog('');return toast('Backup complete ✔')}catch(e){prog('');if(e.name==='AbortError')return}}
 const a=E('a');a.href=URL.createObjectURL(new Blob([j]));a.download='mrvid-backup.json';a.click();toast('Saved folders & settings file (full video backup needs desktop Chrome/Edge)')}

function greet(){if(!M.s.harpy)return;const n=M.s.name,l=[`Welcome back, ${n}~ ♥`,`${n}, I kept every video safe for you.`,`At your service, ${n}! What shall we watch?`,`${n}, shall I pick something special?`];$('#hiw').innerHTML=M.s.img?`<img src="${M.s.img}" alt="">`:HARPY;$('#hb').textContent=rnd(l);$('#hi').style.display='flex';clearTimeout(greet.t);greet.t=setTimeout(()=>$('#hi').style.display='none',6000)}

document.addEventListener('visibilitychange',()=>{if(document.hidden&&M.s.pin&&$('#pl').style.display!=='block')lock()});
// ---- Player ----
const V=$('#v');let url,hideT,A=null,B=null,loop=0,sleepT,lastT=0,asp=0,spd=1,vol=1,bright=0;
const hint=t=>{const h=$('#hint');h.textContent=t;h.style.display='block';clearTimeout(hint.t);hint.t=setTimeout(()=>h.style.display='none',900)};
const showUI=()=>{$('#ui').classList.remove('h');clearTimeout(hideT);hideT=setTimeout(()=>!V.paused&&$('#ui').classList.add('h'),3500)};
async function play(v,list){cur=v;curList=list||[v];if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(await v.h.getFile());V.src=url;$('#pt').textContent=v.n;$('#pl').style.display='block';A=B=null;$('#ab').classList.remove('on');$('#ab').textContent='A‑B';
 V.onloadedmetadata=()=>{if(!v.m.dur)v.m.dur=V.duration;const t=v.m.pos;if(t>2&&t<V.duration-3)V.currentTime=t;V.playbackRate=spd;V.play().catch(()=>{})};v.m.plays++;save();showUI()}
function step(d){if(!curList.length)return;let i=curList.indexOf(cur);i=shufMode&&d>0?Math.random()*curList.length|0:(i+d+curList.length)%curList.length;play(curList[i],curList)}
V.ontimeupdate=()=>{const t=V.currentTime,d=V.duration||0;$('#ct').textContent=tm(t);$('#du').textContent=tm(d);if(d)$('#sk').value=t/d*1000;if(cur){cur.m.pos=t;const dt=t-lastT;if(dt>0&&dt<1.5){cur.m.watch+=dt;cur.m.days[D()]=(cur.m.days[D()]||0)+dt}lastT=t;if(!V.ontimeupdate.s||Date.now()-V.ontimeupdate.s>5000){V.ontimeupdate.s=Date.now();save()}}if(B!=null&&t>=B)V.currentTime=A};
V.onplay=()=>{$('#pp').textContent='⏸';showUI()};V.onpause=()=>{$('#pp').textContent='▶';showUI()};V.onended=()=>{cur.m.pos=0;save();loop?(V.currentTime=0,V.play()):step(1)};
$('#pp').onclick=()=>V.paused?V.play():V.pause();$('#m10').onclick=()=>V.currentTime-=10;$('#p10').onclick=()=>V.currentTime+=10;$('#nx').onclick=()=>step(1);$('#pv').onclick=()=>step(-1);
$('#sk').oninput=e=>{V.currentTime=e.target.value/1000*V.duration};
$('#pb').onclick=()=>{V.pause();save();$('#pl').style.display='none';clearTimeout(sleepT);if(document.fullscreenElement)document.exitFullscreen();render()};
const SP=[.5,.75,1,1.25,1.5,2,3];$('#pr').onclick=()=>{spd=SP[(SP.indexOf(spd)+1)%SP.length];V.playbackRate=spd;$('#pr').textContent=spd+'×'};
const AS=[['contain','Fit'],['cover','Fill'],['fill','Stretch']];$('#pa').onclick=()=>{asp=(asp+1)%3;V.style.objectFit=AS[asp][0];$('#pa').textContent=AS[asp][1]};
$('#lp').onclick=()=>{loop^=1;$('#lp').classList.toggle('on',!!loop);hint(loop?'Repeat one':'Repeat off')};
$('#ab').onclick=()=>{if(A==null){A=V.currentTime;$('#ab').textContent='A→';$('#ab').classList.add('on')}else if(B==null){B=V.currentTime;$('#ab').textContent='A‑B ✔'}else{A=B=null;$('#ab').textContent='A‑B';$('#ab').classList.remove('on')}};
let sl=0;$('#zz').onclick=()=>{sl=(sl+1)%4;const m=[0,15,30,60][sl];clearTimeout(sleepT);if(m)sleepT=setTimeout(()=>{V.pause();hint('Sleep timer: paused')},m*6e4);$('#zz').classList.toggle('on',!!m);hint(m?`Sleep in ${m} min`:'Sleep timer off')};
$('#sc').onclick=()=>{const c=E('canvas');c.width=V.videoWidth;c.height=V.videoHeight;c.getContext('2d').drawImage(V,0,0);c.toBlob(b=>{const a=E('a');a.href=URL.createObjectURL(b);a.download='mrvid-'+tm(V.currentTime).replace(/:/g,'-')+'.png';a.click();hint('📸 Saved')})};
$('#pip').onclick=()=>V.requestPictureInPicture&&V.requestPictureInPicture().catch(()=>{});
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():($('#pl').requestFullscreen||(()=>{})).call($('#pl'));
let tx,ty,tt=0,mode,v0;
$('#pl').addEventListener('touchstart',e=>{if(e.target.closest('#ui button,#sk'))return;const t=e.touches[0];tx=t.clientX;ty=t.clientY;mode=null;v0=tx<innerWidth/2?bright:vol},{passive:true});
$('#pl').addEventListener('touchmove',e=>{if(tx==null)return;const t=e.touches[0],dy=ty-t.clientY;if(Math.abs(dy)>15&&Math.abs(t.clientX-tx)<Math.abs(dy)){mode=1;const n=Math.max(0,Math.min(1,v0+dy/300));if(tx<innerWidth/2){bright=n;$('#dim').style.opacity=.8*(1-n)||0;hint('☀ '+Math.round(n*100)+'%')}else{vol=n;V.volume=n;hint('🔊 '+Math.round(n*100)+'%')}}},{passive:true});
$('#pl').addEventListener('touchend',e=>{if(tx==null)return;const x=tx;tx=null;if(mode)return;if(e.target.closest('#ui button,#sk'))return;const n=Date.now();if(n-tt<300){const d=x<innerWidth/2?-10:10;V.currentTime+=d;hint((d>0?'⏩ +':'⏪ ')+d+'s');tt=0}else{tt=n;setTimeout(()=>{if(tt===n)$('#ui').classList.contains('h')?showUI():$('#ui').classList.add('h')},300)}});
$('#pl').onmousemove=showUI;
addEventListener('keydown',e=>{if($('#pl').style.display!=='block')return;const k=e.key;if(k===' '){e.preventDefault();$('#pp').click()}else if(k==='ArrowRight')V.currentTime+=10;else if(k==='ArrowLeft')V.currentTime-=10;else if(k==='f')$('#fs').click();else if(k==='m')V.muted=!V.muted;else if(k==='Escape')$('#pb').click()});
apply();render_init();function render_init(){init().then(()=>{if(M.s.pin)lock();else greet()})}
